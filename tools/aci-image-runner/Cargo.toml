[package]
name = "aci-image-runner"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mxc-sdk = { git = "https://github.com/microsoft/mxc.git", rev = "40eebd39ab5e5a02d350169a8c96c28b33ddba7e", default-features = false, features = ["microvm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
